{
  "name": "Sync channels job",
  "on": {
    "schedule": [{"cron": "2-59/5 * * * *"}],
    "workflow_dispatch": {}
  },
  "permissions": {"contents": "read"},
  "concurrency": {"group": "sync-channels", "cancel-in-progress": false},
  "jobs": {
    "sync": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {"uses": "actions/checkout@v4"},
        {"uses": "actions/setup-node@v4", "with": {"node-version": 20}},
        {"run": "npm install --no-audit --no-fund"},
        {
          "run": "node sync.js",
          "env": {
            "FIREBASE_SERVICE_ACCOUNT": "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}",
            "FIREBASE_DB_URL": "${{ secrets.FIREBASE_DB_URL }}",
            "ADMIN_UID": "${{ secrets.ADMIN_UID }}",
            "ONESIGNAL_APP_ID": "${{ secrets.ONESIGNAL_APP_ID }}",
            "ONESIGNAL_API_KEY": "${{ secrets.ONESIGNAL_API_KEY }}",
            "CHANNELS_JSON": "${{ secrets.CHANNELS_JSON }}"
          }
        }
      ]
    }
  }
}
